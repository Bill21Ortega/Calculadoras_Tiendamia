<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#e30613" />
  <title>CALCULADORAS TIENDAMIA</title>

  <!-- Estilos del sitio madre -->
  <link rel="stylesheet" href="main.css" />
</head>
<body>
  <!-- ===== Header y logo ===== -->
  <img src="logo-tm-white.webp" alt="Logo Tiendamia" class="logo-top">
  <header class="site-header"> 🧮 CALCULADORAS TIENDAMIA 🧮 </header>

  <!-- ===== Barra de pestañas ===== -->
  <nav class="tabs" role="tablist" aria-label="Pestañas de calculadoras">
    <button class="tab" role="tab" aria-selected="false"
            data-src="Calculadoras/fecha de entrega/index.html">📦 Calculadora de Fecha de Entrega</button>

    <button class="tab" role="tab" aria-selected="false"
            data-src="Calculadoras/peso/index.html">⚖️ Calculadora de Peso</button>

    <button class="tab" role="tab" aria-selected="false"
            data-src="Calculadoras/devolucion/index.html">🔄 Costos de Devolución</button>
  </nav>

  <!-- ===== Contenedor principal: iframe que carga cada calculadora intacta ===== -->
  <main class="main-area" role="main">
    <!-- El src inicial carga la calculadora de fecha (primera pestaña) -->
    <iframe id="calcFrame" title="Calculadoras Tiendamia"
        src="Calculadoras/fecha de entrega/index.html"
        frameborder="0"
        sandbox="allow-same-origin allow-scripts allow-forms"></iframe>

  </main>


  <!-- Logo inferior -->
  <img src="TiendamiaLogo.png" alt="Tiendamia" class="logo-brand">

  <!-- Script principal: controla pestañas e iframe -->
  <script src="main.js"></script>
  <noscript style="display:block;padding:12px;text-align:center;color:#7a2629;">
    ⚠️ Esta página requiere JavaScript para cambiar entre las calculadoras.
  </noscript>
</body>
</html>
